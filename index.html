<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="EnglishGo — офлайн-приложение для разговорного английского">
  <meta name="theme-color" content="#4f46e5">
  <title>EnglishGo</title>
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
  <script>
    // тема до загрузки стилей — без мигания
    (function () {
      try {
        var s = JSON.parse(localStorage.getItem('eg.settings') || '{}');
        var t = s.theme || 'auto';
        if (t === 'auto') t = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) { document.documentElement.setAttribute('data-theme', 'light'); }
    })();
  </script>
</head>
<body class="loading">
  <div class="app">
    <aside class="sidebar">
      <a class="brand" href="#/home">
        <img src="assets/icon.svg" alt="" width="32" height="32">
        <span>English<b>Go</b></span>
      </a>
      <nav id="side-nav" class="side-nav" aria-label="Разделы"></nav>
      <div class="hud">
        <span title="Серия дней"><span class="hud-ic">🔥</span><b id="hud-streak">0</b></span>
        <span title="XP сегодня / цель"><span class="hud-ic">⚡</span><b id="hud-xp">0</b></span>
      </div>
    </aside>

    <header class="topbar">
      <a class="brand" href="#/home">
        <img src="assets/icon.svg" alt="" width="28" height="28">
        <span>English<b>Go</b></span>
      </a>
    </header>

    <main id="view" class="view" tabindex="-1">
      <div class="boot">Загрузка…</div>
    </main>
  </div>

  <nav id="bottom-nav" class="bottom-nav" aria-label="Разделы"></nav>
  <div id="toast-root" class="toast-root" aria-live="polite"></div>
  <div id="modal-root"></div>

  <noscript><p style="padding:20px">Для работы EnglishGo включите JavaScript.</p></noscript>

  <!-- Учебные данные -->
  <script src="data/vocabulary.js"></script>
  <script src="data/dialogues.js"></script>
  <script src="data/lessons.js"></script>

  <!-- Ядро (классические скрипты с пространством имён window.EG — работают через file://) -->
  <script src="js/storage.js"></script>
  <script src="js/database.js"></script>
  <script src="js/state.js"></script>
  <script src="js/srs.js"></script>
  <script src="js/progress.js"></script>
  <script src="js/exercises.js"></script>
  <script src="js/dialogues.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/router.js"></script>

  <!-- Экраны -->
  <script src="js/views/player.js"></script>
  <script src="js/views/home.js"></script>
  <script src="js/views/learn.js"></script>
  <script src="js/views/words.js"></script>
  <script src="js/views/conversation.js"></script>
  <script src="js/views/stats.js"></script>
  <script src="js/views/settings.js"></script>

  <script src="js/app.js"></script>
</body>
</html>
