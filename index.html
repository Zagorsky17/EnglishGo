<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <!-- CSP: только собственные файлы, никаких сетевых запросов, встроенных скриптов и плагинов -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'none'; media-src 'none'; object-src 'none'; frame-src 'none'; worker-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="EnglishGo — офлайн-приложение для разговорного английского">
  <meta name="theme-color" content="#4f46e5">
  <title>EnglishGo</title>
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="grammar/grammar.css">
  <link rel="stylesheet" href="tenses/tenses.css">
  <link rel="stylesheet" href="irregular/irregular.css">
  <link rel="stylesheet" href="gtoday/gtoday.css">
  <script src="js/theme-boot.js"></script>
</head>
<body class="loading">
  <div class="app">
    <aside class="sidebar">
      <a class="brand" href="#/home">
        <img src="assets/icon.svg" alt="" width="32" height="32">
        <span>English<b>Go</b></span>
      </a>
      <nav id="side-nav" class="side-nav" aria-label="Разделы"></nav>
      <div class="hud">
        <button class="hud-chip" type="button" id="hud-streak-btn" title="Серия дней — нажмите, чтобы узнать подробнее" aria-label="Серия дней — что это значит">
          <span class="hud-top"><span class="hud-ic">🔥</span><b id="hud-streak">0</b></span>
          <span class="hud-label" id="hud-streak-label">дней подряд</span>
        </button>
        <button class="hud-chip" type="button" id="hud-xp-btn" title="XP за сегодня — нажмите, чтобы узнать подробнее" aria-label="XP за сегодня — что это значит">
          <span class="hud-top"><span class="hud-ic">⚡</span><b id="hud-xp">0</b></span>
          <span class="hud-label" id="hud-xp-label">XP сегодня</span>
        </button>
      </div>
    </aside>

    <header class="topbar">
      <a class="brand" href="#/home">
        <img src="assets/icon.svg" alt="" width="28" height="28">
        <span>English<b>Go</b></span>
      </a>
    </header>

    <main id="view" class="view" tabindex="-1">
      <div class="boot">Загрузка…</div>
    </main>
  </div>

  <nav id="bottom-nav" class="bottom-nav" aria-label="Разделы"></nav>
  <div id="toast-root" class="toast-root" aria-live="polite"></div>
  <div id="modal-root"></div>

  <noscript><p class="noscript">Для работы EnglishGo включите JavaScript.</p></noscript>

  <!-- Учебные данные -->
  <script src="data/vocabulary.js"></script>
  <script src="data/registers.js"></script>
  <script src="data/dialogues.js"></script>
  <script src="data/dialogues-more.js"></script>
  <script src="data/talks.js"></script>
  <script src="data/stories.js"></script>
  <script src="data/chats.js"></script>
  <script src="data/chats-more.js"></script>
  <script src="data/chats-extra.js"></script>
  <script src="data/lessons.js"></script>
  <script src="data/words/a1.js"></script>
  <script src="data/words/a2.js"></script>
  <script src="data/words/b1.js"></script>
  <script src="data/words/b2.js"></script>
  <script src="data/words/c1.js"></script>
  <script src="data/wordbank.js"></script>
  <script src="data/texts.js"></script>

  <!-- Ядро (классические скрипты с пространством имён window.EG — работают через file://) -->
  <script src="js/storage.js"></script>
  <script src="js/database.js"></script>
  <script src="js/state.js"></script>
  <script src="js/srs.js"></script>
  <script src="js/progress.js"></script>
  <script src="js/exercises.js"></script>
  <script src="js/dialogues.js"></script>
  <script src="js/chat.js"></script>
  <script src="js/games.js"></script>
  <script src="js/wordtrainer.js"></script>
  <script src="js/lexicon.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/router.js"></script>
  <script src="js/instance.js"></script>

  <!-- Экраны -->
  <script src="js/views/player.js"></script>
  <script src="js/views/home.js"></script>
  <script src="js/views/learn.js"></script>
  <script src="js/views/words.js"></script>
  <script src="js/views/favorites.js"></script>
  <script src="js/views/vocab.js"></script>
  <script src="js/views/conversation.js"></script>
  <script src="js/views/stats.js"></script>
  <script src="js/views/settings.js"></script>
  <script src="js/views/stories.js"></script>
  <script src="js/views/reading.js"></script>
  <script src="js/views/chats.js"></script>
  <script src="js/views/games.js"></script>

  <!-- Раздел «Грамматика» — изолированный модуль (EG.grammar, своё хранилище IndexedDB) -->
  <script src="grammar/grammar-data.js"></script>
  <script src="grammar/grammar-ui.js"></script>
  <script src="grammar/grammar.js"></script>

  <!-- Раздел «Таблица времён» — изолированная шпаргалка (EG.tenses), ничего не сохраняет -->
  <script src="tenses/tenses-data.js"></script>
  <script src="tenses/tenses.js"></script>

  <!-- Разделы «Неправильные глаголы» (таблица) и «Неправильные глаголы сегодня» — изолированный модуль (EG.irregular, своё хранилище IndexedDB) -->
  <script src="irregular/irregular-data.js"></script>
  <script src="irregular/irregular-table.js"></script>
  <script src="irregular/iverbs.js"></script>

  <!-- Раздел «Грамматика сегодня» — изолированный модуль (EG.gtoday, своё хранилище IndexedDB) -->
  <script src="gtoday/gtoday-data.js"></script>
  <script src="gtoday/gtoday-run.js"></script>
  <script src="gtoday/gtoday.js"></script>

  <script src="js/app.js"></script>
</body>
</html>
